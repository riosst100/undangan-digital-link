name: Deploy to production

# Push to master -> build the backend and frontend images here and push them to ghcr.io, then the
# server (Docker, /var/www/undangan-digital) runs ./deploy.sh: pull master + those images, restart.
# The server never builds (4GB RAM shared with other stacks: Next.js builds there caused OOM kills).
on:
  push:
    branches: [master]
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build:
    name: Build images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Build definitions (context, Dockerfile, args, image tags) come straight from docker-compose.prod.yml.
      - uses: docker/bake-action@v6
        env:
          DB_PASSWORD: ci-build-only  # required by the compose file; not used by the builds
        with:
          source: .
          files: docker-compose.prod.yml
          targets: backend,frontend
          push: true
          set: |
            backend.cache-from=type=gha,scope=backend
            backend.cache-to=type=gha,mode=max,scope=backend
            frontend.cache-from=type=gha,scope=frontend
            frontend.cache-to=type=gha,mode=max,scope=frontend

  deploy:
    name: Deploy to VPS
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Deploy over SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          # On the server this key may only run deploy.sh (forced command in authorized_keys).
          # stdin = user + this job's token (packages: read, expires with the job) so the server can pull.
          printf '%s\n%s\n' "$GHCR_USER" "$GHCR_TOKEN" | ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
            -o ServerAliveInterval=30 "$USER@$HOST" deploy
