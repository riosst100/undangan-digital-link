# Production: https://catalog.undangan-digital.link (Caddy on the host -> frontend 127.0.0.1:3070, API 127.0.0.1:8070).
#   ./deploy.sh         pull master + the images CI built (ghcr.io), restart; run by hand it builds here instead
# Images are built by GitHub Actions (.github/workflows/deploy.yml) so the 4GB server never runs a build.
# mem_limit caps each container so one runaway process can't OOM the other stacks on this server.
# Secrets come from .env next to this file (see .env.prod.example). docker-compose.yml is the dev stack.
name: undangan

x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "5" }

services:
  db:
    image: postgres:16-alpine
    container_name: undangan-db
    restart: unless-stopped
    mem_limit: 512m
    environment:
      POSTGRES_DB: undangan_digital
      POSTGRES_USER: undangan_app
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U undangan_app -d undangan_digital"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging: *logging

  backend:
    build:
      context: ./docker/backend
      dockerfile: Dockerfile.prod
    image: ghcr.io/riosst100/undangan-backend:latest
    container_name: undangan-backend
    restart: unless-stopped
    # Headroom for composer install + migrations at startup and PHP-FPM workers (8 x 256M max).
    mem_limit: 768m
    user: "1000:1000"
    volumes:
      - ./backend:/app
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      LOG_LEVEL: warning
      APP_URL: https://catalog.undangan-digital.link
      FRONTEND_URL: https://catalog.undangan-digital.link
      SANCTUM_STATEFUL_DOMAINS: catalog.undangan-digital.link
      SESSION_DOMAIN: catalog.undangan-digital.link
      SESSION_SECURE_COOKIE: "true"
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: "5432"
      DB_DATABASE: undangan_digital
      DB_USERNAME: undangan_app
      DB_PASSWORD: ${DB_PASSWORD}
      # Local disk until Cloudflare R2 credentials are configured (then: r2 + AWS_* below).
      FILESYSTEM_DISK: ${FILESYSTEM_DISK:-public}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_ENDPOINT: ${AWS_ENDPOINT:-}
      AWS_URL: ${AWS_URL:-}
    depends_on:
      db: { condition: service_healthy }
    logging: *logging

  nginx:
    image: nginx:1.27-alpine
    container_name: undangan-nginx
    restart: unless-stopped
    mem_limit: 128m
    volumes:
      - ./backend/public:/app/public:ro
      # public/storage is a symlink to /app/storage/app/public: uploads must exist at that path here too.
      - ./backend/storage/app/public:/app/storage/app/public:ro
      - ./docker/nginx/api.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:8070:80"
    depends_on: [backend]
    logging: *logging

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        NEXT_PUBLIC_APP_URL: https://catalog.undangan-digital.link
        NEXT_PUBLIC_API_URL: https://catalog.undangan-digital.link
    image: ghcr.io/riosst100/undangan-frontend:latest
    container_name: undangan-frontend
    restart: unless-stopped
    mem_limit: 512m
    environment:
      NODE_ENV: production
      # Server-side fetches go straight to the API container instead of out through Cloudflare.
      API_INTERNAL_URL: http://nginx
    ports:
      - "127.0.0.1:3070:3000"
    depends_on: [nginx]
    logging: *logging

volumes:
  db_data:
