# Laravel (PHP-FPM) for /api, /sanctum, /storage and /up. Caddy on the host terminates HTTPS and sets
# X-Forwarded-For / X-Forwarded-Proto, which are passed through unchanged (Laravel trusts this hop).
server {
    listen 80 default_server;
    server_name _;
    root /app/public;
    index index.php;

    # Re-resolve the backend container's IP (it changes when the container is recreated).
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $php_upstream backend:9000;

    client_max_body_size 24M;
    server_tokens off;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass $php_upstream;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 60s;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
