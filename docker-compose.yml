# Dev stack: docker compose up --build   (jalankan dari WSL)
# Frontend: http://localhost:${FRONTEND_PORT:-3100} | API: http://localhost:${BACKEND_PORT:-8001} | Postgres: shared, from ~/projects/services (start it first)
services:
  backend:
    build: ./backend
    # Retries until the shared PostgreSQL is up (migrate runs in the entrypoint).
    restart: unless-stopped
    networks:
      - default
      - services
    ports:
      - "${BACKEND_PORT:-8001}:8000"
    volumes:
      - ./backend:/var/www/html
      - backend_vendor:/var/www/html/vendor
    environment:
      APP_URL: http://localhost:${BACKEND_PORT:-8001}
      FRONTEND_URL: http://localhost:${FRONTEND_PORT:-3100}
      SANCTUM_STATEFUL_DOMAINS: localhost:${FRONTEND_PORT:-3100}
      SESSION_DOMAIN: localhost
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_DATABASE: undangan_digital
      DB_USERNAME: undangan_app
      DB_PASSWORD: ${DB_PASSWORD:-secret}

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-3100}:3000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/.next
    environment:
      NEXT_PUBLIC_APP_URL: http://localhost:${FRONTEND_PORT:-3100}
      NEXT_PUBLIC_API_URL: http://localhost:${BACKEND_PORT:-8001}
      API_INTERNAL_URL: http://backend:8000
      WATCHPACK_POLLING: "true"

networks:
  services:
    external: true

volumes:
  backend_vendor:
  frontend_node_modules:
  frontend_next:
